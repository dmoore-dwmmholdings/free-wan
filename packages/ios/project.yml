# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen` here, then open FreeWAN.xcodeproj.
# The .xcodeproj is generated and gitignored; edit this file instead.
name: FreeWAN
options:
  bundleIdPrefix: com.freewan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FreeWANKit:
    path: FreeWANKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FreeWAN:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FreeWANKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freewan.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FreeWAN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Portrait only; landscape is listed for full-screen video, which AppDelegate allows alone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain-HTTP servers on the LAN (http://192.168.x.x:8080). Tailnet addresses are HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Unlocking private servers.
        NSFaceIDUsageDescription: FreeWAN uses Face ID to show your private servers.
        # Deleting uploaded photos and videos from the phone, when asked to after an upload.
        NSPhotoLibraryUsageDescription: FreeWAN deletes photos and videos from your library after uploading them, when you ask it to.
        # Picture in Picture and audio with the screen locked.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.freewan.app
            CFBundleURLSchemes: [freewan]
