# Free-WAN, installed from published images — no source checkout needed.
# Runs the image published to GHCR by .github/workflows/release.yml instead of building from
# source: `FW_VERSION=0.7.0 docker compose -f docker-compose.release.yml up -d`.
services:
  # Tailscale sidecar — provides private HTTPS for the app over your tailnet via Serve.
  # The app shares this container's network namespace, so Serve proxies to localhost:8080.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: free-wan-ts
    hostname: ${TS_HOSTNAME:-free-wan}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  free-wan:
    image: ghcr.io/dmoore-dwmmholdings/free-wan:${FW_VERSION:-latest}
    container_name: free-wan
    restart: unless-stopped
    depends_on:
      - tailscale
    # Share the tailnet so `tailscale serve` reaches the app on 127.0.0.1:8080.
    network_mode: service:tailscale
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=127.0.0.1
      - DATA_DIR=/app/data
      - TRUST_PROXY=true
      # Lets an in-app update restart the process itself; `restart: unless-stopped` then
      # brings it back on the new code. Without this an update stages files but keeps
      # serving the old build until you restart the container by hand.
      - FW_SUPERVISED=1
      - SESSION_SECRET=${SESSION_SECRET:?set a long random SESSION_SECRET in .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - COMMAND_ALLOWED_EXECUTABLES=${COMMAND_ALLOWED_EXECUTABLES:-}
    volumes:
      - ./data:/app/data
      # Mount your media drives read-only and list them in config/repositories.yaml:
      # - /path/to/drive-a:/media/drive-a:ro
      # - /path/to/drive-b:/media/drive-b:ro
